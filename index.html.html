
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #scene {
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1rem; min-height: 540px; position: relative;
    font-family: var(--font-sans); overflow: hidden;
  }
  #message {
    font-size: 24px; font-weight: 500; color: var(--color-text-primary);
    text-align: center; min-height: 40px; margin-bottom: 1.5rem;
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #message.visible { opacity: 1; transform: scale(1); }
  #blow-btn {
    font-size: 16px; padding: 12px 32px; border-radius: 999px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary); color: var(--color-text-primary);
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    font-family: var(--font-sans);
  }
  #blow-btn:hover { background: var(--color-background-secondary); }
  #blow-btn:active { transform: scale(0.97); }
  #blow-btn:disabled { opacity: 0.4; cursor: default; }
  .cp { position: absolute; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall {
    0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
  }
</style>

<div id="scene">
  <div id="message">С днём рождения, любимая мамочка! 🌸</div>

  <svg width="300" height="280" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">

    <!-- Plate -->
    <ellipse cx="150" cy="258" rx="130" ry="11" fill="#E8D5C4" opacity="0.5"/>

    <!-- Bottom tier -->
    <rect x="30" y="168" width="240" height="82" rx="8" fill="#F5C3A2"/>
    <rect x="30" y="163" width="240" height="16" rx="6" fill="#fff" opacity="0.7"/>
    <ellipse cx="62"  cy="168" rx="14" ry="9" fill="#fff" opacity="0.8"/>
    <ellipse cx="100" cy="166" rx="12" ry="8" fill="#fff" opacity="0.8"/>
    <ellipse cx="140" cy="169" rx="13" ry="9" fill="#fff" opacity="0.8"/>
    <ellipse cx="180" cy="166" rx="12" ry="8" fill="#fff" opacity="0.8"/>
    <ellipse cx="218" cy="168" rx="13" ry="9" fill="#fff" opacity="0.8"/>
    <ellipse cx="254" cy="168" rx="11" ry="8" fill="#fff" opacity="0.8"/>
    <circle cx="75"  cy="207" r="5" fill="#F472B6"/>
    <circle cx="115" cy="202" r="4" fill="#A78BFA"/>
    <circle cx="150" cy="207" r="5" fill="#F472B6"/>
    <circle cx="185" cy="202" r="4" fill="#A78BFA"/>
    <circle cx="225" cy="207" r="5" fill="#F472B6"/>

    <!-- Top tier -->
    <rect x="72" y="96" width="156" height="70" rx="8" fill="#F9A8C0"/>
    <rect x="72" y="91" width="156" height="16" rx="6" fill="#fff" opacity="0.75"/>
    <ellipse cx="92"  cy="96" rx="11" ry="8" fill="#fff" opacity="0.8"/>
    <ellipse cx="122" cy="94" rx="10" ry="7" fill="#fff" opacity="0.8"/>
    <ellipse cx="150" cy="97" rx="11" ry="8" fill="#fff" opacity="0.8"/>
    <ellipse cx="178" cy="94" rx="10" ry="7" fill="#fff" opacity="0.8"/>
    <ellipse cx="208" cy="96" rx="10" ry="8" fill="#fff" opacity="0.8"/>

    <!-- Candles: x centers at 103, 133, 163, 197 -->
    <rect x="96"  y="60" width="14" height="33" rx="3" fill="#F472B6"/>
    <rect x="126" y="55" width="14" height="38" rx="3" fill="#A78BFA"/>
    <rect x="156" y="60" width="14" height="33" rx="3" fill="#60A5FA"/>
    <rect x="190" y="57" width="14" height="36" rx="3" fill="#34D399"/>

    <!-- Flames drawn as simple ellipses stacked — no translate tricks -->
    <!-- Candle tops (wick Y): c1=60, c2=55, c3=60, c4=57 -->
    <!-- Flame base sits at wick top, extends upward -->

    <!-- Flame 1 — center x=103, base y=60 → center of flame y=60-14=46 -->
    <g id="f1">
      <ellipse cx="103" cy="46" rx="7" ry="14" fill="#FCD34D"/>
      <ellipse cx="103" cy="48" rx="5" ry="10" fill="#FB923C"/>
      <ellipse cx="103" cy="50" rx="2.5" ry="5" fill="#FFF3B0" opacity="0.95"/>
    </g>

    <!-- Flame 2 — center x=133, base y=55 → center y=55-14=41 -->
    <g id="f2">
      <ellipse cx="133" cy="41" rx="7" ry="14" fill="#FCD34D"/>
      <ellipse cx="133" cy="43" rx="5" ry="10" fill="#FB923C"/>
      <ellipse cx="133" cy="45" rx="2.5" ry="5" fill="#FFF3B0" opacity="0.95"/>
    </g>

    <!-- Flame 3 — center x=163, base y=60 → center y=46 -->
    <g id="f3">
      <ellipse cx="163" cy="46" rx="7" ry="14" fill="#FCD34D"/>
      <ellipse cx="163" cy="48" rx="5" ry="10" fill="#FB923C"/>
      <ellipse cx="163" cy="50" rx="2.5" ry="5" fill="#FFF3B0" opacity="0.95"/>
    </g>

    <!-- Flame 4 — center x=197, base y=57 → center y=43 -->
    <g id="f4">
      <ellipse cx="197" cy="43" rx="7" ry="14" fill="#FCD34D"/>
      <ellipse cx="197" cy="45" rx="5" ry="10" fill="#FB923C"/>
      <ellipse cx="197" cy="47" rx="2.5" ry="5" fill="#FFF3B0" opacity="0.95"/>
    </g>

    <!-- Smoke (hidden initially) -->
    <ellipse id="s1" cx="103" cy="46" rx="3" ry="2" fill="#aaa" opacity="0"/>
    <ellipse id="s2" cx="133" cy="41" rx="3" ry="2" fill="#aaa" opacity="0"/>
    <ellipse id="s3" cx="163" cy="46" rx="3" ry="2" fill="#aaa" opacity="0"/>
    <ellipse id="s4" cx="197" cy="43" rx="3" ry="2" fill="#aaa" opacity="0"/>

  </svg>

  <button id="blow-btn">🎉 Задуть свечи!</button>
</div>

<script>
(function() {
  const btn = document.getElementById('blow-btn');
  const msg = document.getElementById('message');
  const scene = document.getElementById('scene');
  let blown = false;

  const flameData = [
    { id: 'f1', cx: 103, cy: 46 },
    { id: 'f2', cx: 133, cy: 41 },
    { id: 'f3', cx: 163, cy: 46 },
    { id: 'f4', cx: 197, cy: 43 },
  ];

  const smokeData = [
    { id: 's1' }, { id: 's2' }, { id: 's3' }, { id: 's4' }
  ];

  function flicker() {
    if (blown) return;
    flameData.forEach(fd => {
      const g = document.getElementById(fd.id);
      const sy = 0.85 + Math.random() * 0.3;
      const sx = 0.88 + Math.random() * 0.22;
      const tx = (Math.random() - 0.5) * 2;
      const ty = (Math.random() - 0.5) * 1.5;
      g.style.transformOrigin = fd.cx + 'px ' + (fd.cy + 14) + 'px';
      g.style.transition = 'transform 0.12s ease';
      g.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`;
    });
    setTimeout(flicker, 100 + Math.random() * 140);
  }
  flicker();

  function spawnConfetti() {
    const colors = ['#F472B6','#A78BFA','#60A5FA','#34D399','#FCD34D','#F97316'];
    for (let i = 0; i < 55; i++) {
      const el = document.createElement('div');
      el.className = 'cp';
      el.style.left = (Math.random() * 100) + '%';
      el.style.top = '-10px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * 0.8) + 's';
      const sz = (6 + Math.random() * 8) + 'px';
      el.style.width = sz; el.style.height = sz;
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      scene.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
  }

  btn.addEventListener('click', function() {
    if (blown) return;
    blown = true;
    btn.disabled = true;

    flameData.forEach((fd, i) => {
      setTimeout(() => {
        const g = document.getElementById(fd.id);
        g.style.transformOrigin = fd.cx + 'px ' + (fd.cy + 14) + 'px';
        g.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        g.style.opacity = '0';
        g.style.transform = 'scaleY(0)';
      }, i * 100);
    });

    setTimeout(() => {
      smokeData.forEach((sd, i) => {
        const el = document.getElementById(sd.id);
        let y = parseFloat(el.getAttribute('cy'));
        let op = 0.5;
        el.setAttribute('opacity', op);
        const iv = setInterval(() => {
          y -= 1.3; op -= 0.02;
          el.setAttribute('cy', y);
          el.setAttribute('opacity', Math.max(0, op));
          el.setAttribute('rx', Math.min(7, parseFloat(el.getAttribute('rx')) + 0.15));
          if (op <= 0) clearInterval(iv);
        }, 40);
      });
    }, 420);

    setTimeout(() => {
      msg.classList.add('visible');
      spawnConfetti();
      btn.textContent = '🌸 С днём рождения!';
    }, 750);
  });
})();
</script>
